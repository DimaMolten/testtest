<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кроссовки — Мой магазин</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #fafafa;
        color: #222;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
    }

    .header-inner {
        max-width: 1100px;
        min-height: 68px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
    }

    .logo {
        color: #222;
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
    }

    nav {
        display: flex;
        align-items: center;
        gap: 24px;
    }

    nav a {
        color: #555;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.2s;
    }

    nav a:hover {
        color: #000;
    }

    main {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px 56px;
        flex: 1;
    }

    .product {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #eaeaea;
        border-radius: 8px;

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
    }

    .product-image {
        display: block;
        width: 100%;
        height: 420px;
        object-fit: cover;
        border-radius: 6px;
        background: #f0f0f0;
    }

    .product-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .product-info h1 {
        margin-bottom: 12px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    .price {
        margin-bottom: 20px;
        font-size: 20px;
        font-weight: 600;
    }

    .description {
        margin-bottom: 24px;
        color: #555;
        font-size: 15px;
        line-height: 1.6;
    }

    .size-title {
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
    }

    .sizes {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 24px;
    }

    .size {
        min-width: 42px;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 5px;
        color: #222;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
    }

    .size:hover {
        background: #f0f0f0;
        border-color: #999;
    }

    .add-to-cart {
        width: 100%;
        min-height: 40px;
        padding: 9px 12px;
        border: 1px solid #222;
        border-radius: 5px;
        background: #222;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .add-to-cart:hover {
        background: #444;
    }

    footer {
        margin-top: auto;
        padding: 22px 18px;
        border-top: 1px solid #e8e8e8;
        background: #fff;
        color: #777;
        font-size: 13px;
        text-align: center;
    }

    @media (max-width: 700px) {
        .header-inner {
            min-height: 60px;
            padding: 14px 18px;
            gap: 12px;
        }

        .logo {
            font-size: 17px;
        }

        nav {
            gap: 14px;
        }

        nav a {
            font-size: 13px;
        }

        main {
            padding: 30px 18px 40px;
        }

        .product {
            grid-template-columns: 1fr;
            gap: 24px;
            padding: 18px;
        }

        .product-image {
            height: 350px;
        }

        .product-info h1 {
            font-size: 23px;
        }
    }

    @media (max-width: 360px) {
        .header-inner {
            flex-wrap: wrap;
        }

        nav {
            width: 100%;
            justify-content: flex-start;
        }

        .product-image {
            height: 300px;
        }
    }
</style>

</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="logo">
            Мой магазин
        </a>

        <nav>
            <a href="index.html">Главная</a>
            <a href="cart.html">Корзина</a>
        </nav>

    </div>
</header>

<main>

    <div class="product">

        <img
            class="product-image"
            src="images/product2.jpg"
            alt="Кроссовки"
        >

        <div class="product-info">

            <h1>Кроссовки</h1>

            <div class="price">
                2000 грн
            </div>

            <p class="description">
                Удобные повседневные кроссовки.
                Подходят для прогулок, учёбы и
                повседневной носки.
            </p>

            <p class="size-title">
                Размер:
            </p>

            <div class="sizes">

                <button class="size">39</button>
                <button class="size">40</button>
                <button class="size">41</button>
                <button class="size">42</button>
                <button class="size">43</button>

            </div>

            <button class="add-to-cart">
                Добавить в корзину
            </button>

        </div>

    </div>

</main>

<footer>
    © 2026 Мой магазин
</footer>

<script>
    const addToCartButton = document.querySelector(".add-to-cart");

    addToCartButton.addEventListener("click", function () {

        const product = {
            id: 2,
            name: "Кроссовки",
            price: 2000,
            image: "images/product2.jpg"
        };

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const existingProduct = cart.find(item => item.id === product.id);

        if (existingProduct) {
            existingProduct.quantity++;
        } else {
            product.quantity = 1;
            cart.push(product);
        }

        localStorage.setItem("cart", JSON.stringify(cart));

        alert("Кроссовки добавлены в корзину!");
    });
</script>

</body>

</html>
