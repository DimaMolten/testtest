<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Корзина — Мой магазин</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #fafafa;
        color: #222;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
    }

    .header-inner {
        max-width: 1100px;
        min-height: 68px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
    }

    .logo {
        color: #222;
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
    }

    nav {
        display: flex;
        align-items: center;
        gap: 24px;
    }

    nav a {
        color: #555;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.2s;
    }

    nav a:hover {
        color: #000;
    }

    main {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px 56px;
        flex: 1;
    }

    .page-heading {
        margin-bottom: 24px;
        text-align: center;
    }

    h1 {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    .cart {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px;
        background: #fff;
        border: 1px solid #eaeaea;
        border-radius: 8px;
    }

    .cart-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid #eaeaea;
    }

    .cart-item:first-child {
        padding-top: 0;
    }

    .cart-item img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 6px;
        background: #f0f0f0;
    }

    .cart-item-info {
        flex: 1;
        min-width: 0;
    }

    .cart-item-info h2 {
        margin-bottom: 4px;
        font-size: 16px;
        font-weight: 600;
    }

    .cart-item-info p {
        color: #555;
        font-size: 14px;
    }

    .quantity {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .quantity button {
        width: 30px;
        height: 30px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #fff;
        color: #222;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .quantity button:hover {
        background: #f0f0f0;
    }

    .quantity span {
        min-width: 20px;
        text-align: center;
        font-size: 14px;
    }

    .remove {
        border: none;
        background: none;
        color: #777;
        font-size: 13px;
        cursor: pointer;
        transition: color 0.2s;
    }

    .remove:hover {
        color: #000;
    }

    .total {
        margin-top: 20px;
        font-size: 17px;
        font-weight: 600;
        text-align: right;
    }

    .checkout {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 40px;
        margin-top: 16px;
        padding: 9px 12px;
        border: 1px solid #222;
        border-radius: 5px;
        background: #222;
        color: #fff;
        font-size: 13px;
        text-decoration: none;
        transition: background 0.2s;
    }

    .checkout:hover {
        background: #444;
    }

    .empty {
        padding: 30px 15px;
        text-align: center;
    }

    .empty h2 {
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: 600;
    }

    .empty p {
        margin-bottom: 18px;
        color: #666;
        font-size: 14px;
    }

    .back-to-shop {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 38px;
        padding: 8px 14px;
        border: 1px solid #222;
        border-radius: 5px;
        background: #222;
        color: #fff;
        font-size: 13px;
        text-decoration: none;
        transition: background 0.2s;
    }

    .back-to-shop:hover {
        background: #444;
    }

    footer {
        margin-top: auto;
        padding: 22px 18px;
        border-top: 1px solid #e8e8e8;
        background: #fff;
        color: #777;
        font-size: 13px;
        text-align: center;
    }

    @media (max-width: 700px) {
        .header-inner {
            min-height: 60px;
            padding: 14px 18px;
            gap: 12px;
        }

        .logo {
            font-size: 17px;
        }

        nav {
            gap: 14px;
        }

        nav a {
            font-size: 13px;
        }

        main {
            padding: 30px 18px 40px;
        }

        .page-heading {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 23px;
        }

        .cart {
            padding: 18px;
            max-width: 600px;
        }

        .cart-item {
            flex-wrap: wrap;
            gap: 12px;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
        }

        .cart-item-info {
            min-width: 150px;
        }

        .quantity {
            margin-left: 82px;
        }

        .remove {
            margin-left: auto;
        }

        .total {
            text-align: left;
        }
    }

    @media (max-width: 360px) {
        .header-inner {
            flex-wrap: wrap;
        }

        nav {
            width: 100%;
            justify-content: flex-start;
        }

        .cart {
            padding: 15px;
        }

        .cart-item {
            align-items: flex-start;
        }

        .quantity {
            margin-left: 0;
        }

        .remove {
            margin-left: 0;
        }
    }
</style>

</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            Мой магазин
        </a>

        <nav>

            <a href="index.html">
                Главная
            </a>

            <a href="cart.html">
                Корзина
            </a>

        </nav>

    </div>

</header>

<main>

    <div class="page-heading">

        <h1>
            Корзина
        </h1>

    </div>

    <div class="cart" id="cart">

    </div>

</main>

<footer>
    © 2026 Мой магазин
</footer>

<script>

    function renderCart() {

        const cartElement =
            document.getElementById("cart");

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        if (cart.length === 0) {

            cartElement.innerHTML = `

                <div class="empty">

                    <h2>
                        Корзина пуста
                    </h2>

                    <p>
                        Добавьте товары из магазина.
                    </p>

                    <a
                        href="index.html"
                        class="back-to-shop"
                    >
                        Вернуться в магазин
                    </a>

                </div>

            `;

            return;
        }

        let total = 0;

        let html = "";

        cart.forEach(
            function(product, index) {

                const productTotal =
                    product.price *
                    product.quantity;

                total += productTotal;

                html += `

                    <div class="cart-item">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                        <div class="cart-item-info">

                            <h2>
                                ${product.name}
                            </h2>

                            <p>
                                ${product.price} грн
                            </p>

                        </div>

                        <div class="quantity">

                            <button
                                onclick="changeQuantity(${index}, -1)"
                            >
                                -
                            </button>

                            <span>
                                ${product.quantity}
                            </span>

                            <button
                                onclick="changeQuantity(${index}, 1)"
                            >
                                +
                            </button>

                        </div>

                        <button
                            class="remove"
                            onclick="removeProduct(${index})"
                        >
                            Удалить
                        </button>

                    </div>

                `;

            }
        );

        html += `

            <div class="total">

                Итого:
                ${total} грн

            </div>

            <a
                href="checkout.html"
                class="checkout"
            >
                Оформить заказ
            </a>

        `;

        cartElement.innerHTML = html;

    }

    function changeQuantity(index, change) {

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        cart[index].quantity += change;

        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        renderCart();

    }

    function removeProduct(index) {

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        cart.splice(index, 1);

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        renderCart();

    }

    renderCart();

</script>

</body>

</html>
