<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Главная — Мой магазин</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            color: #222;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
        }

        .header-inner {
            max-width: 1100px;
            min-height: 68px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .logo {
            color: #222;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        nav a {
            color: #555;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #000;
        }

        main {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 56px;
            flex: 1;
        }

        .page-heading {
            margin-bottom: 24px;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            max-width: 760px;
            margin: 0 auto;
        }

        .product {
            min-width: 0;
            overflow: hidden;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
        }

        .product img {
            display: block;
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .product-info {
            padding: 12px 14px;
        }

        .product h2 {
            margin-bottom: 4px;
            font-size: 16px;
            font-weight: 600;
        }

        .price {
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .product a {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 36px;
            padding: 8px 12px;
            border: 1px solid #222;
            border-radius: 5px;
            background: #222;
            color: #fff;
            font-size: 13px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .product a:hover {
            background: #444;
        }

        footer {
            margin-top: auto;
            padding: 22px 18px;
            border-top: 1px solid #e8e8e8;
            background: #fff;
            color: #777;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .header-inner {
                min-height: 60px;
                padding: 14px 18px;
                gap: 12px;
            }

            .logo {
                font-size: 17px;
            }

            nav {
                gap: 14px;
            }

            nav a {
                font-size: 13px;
            }

            main {
                padding: 30px 18px 40px;
            }

            .page-heading {
                margin-bottom: 20px;
            }

            h1 {
                font-size: 23px;
            }

            .products {
                grid-template-columns: 1fr;
                max-width: 380px;
                gap: 16px;
            }

            .product img {
                height: 170px;
            }
        }

        @media (max-width: 360px) {
            .header-inner {
                flex-wrap: wrap;
            }

            nav {
                width: 100%;
                justify-content: flex-start;
            }

            .product img {
                height: 150px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">

            <a href="index.html" class="logo">
                Мой магазин
            </a>

            <nav>
                <a href="index.html">Главная</a>
                <a href="cart.html">Корзина</a>
            </nav>

        </div>
    </header>

    <main>

        <div class="page-heading">
            <h1>Наши товары</h1>
        </div>

        <div class="products">

            <article class="product">

                <img
                    src="images/product1.jpg"
                    alt="Футболка"
                >

                <div class="product-info">

                    <h2>Футболка</h2>

                    <p class="price">500 грн</p>

                    <a href="product1.html">
                        Подробнее
                    </a>

                </div>

            </article>

            <article class="product">

                <img
                    src="images/product2.jpg"
                    alt="Кроссовки"
                >

                <div class="product-info">

                    <h2>Кроссовки</h2>

                    <p class="price">2000 грн</p>

                    <a href="product2.html">
                        Подробнее
                    </a>

                </div>

            </article>

        </div>

    </main>

    <footer>
        © 2026 Мой магазин
    </footer>

</body>

</html>
